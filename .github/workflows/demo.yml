# Build, test and deploy the browser demo (demo/) to GitHub Pages.
#
# Every push that touches the package or the demo builds the site and runs
# three layers of tests: the demo's R glue tests in native R, the package and
# glue tests inside webR, and an end-to-end check in headless Chromium. Only
# pushes to main deploy. Pages must be set to "GitHub Actions" as its source
# (Settings > Pages) for the deploy job to succeed.
name: demo-site

on:
  push:
    paths:
      - 'R/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'tests/**'
      - 'demo/**'
      - '.github/workflows/demo.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # Must match the R inside the pinned webR (webR 0.6.1 ships R 4.6.0).
          # The package is built here and loaded there, and R warns when a
          # package was built under a newer R than the one loading it. Bump
          # this together with webR in demo/package.json; the webR test step
          # fails if the two drift apart in the wrong direction.
          r-version: '4.6.0'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::jsonlite, local::.
          needs: check

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Install demo tooling
        run: npm ci

      - name: Demo glue tests (native R)
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      - name: Build site
        run: npm run build

      - name: Package and glue tests inside webR
        run: npm run test:webr

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end browser tests
        run: npm run test:e2e

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/_site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
